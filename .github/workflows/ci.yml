name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libusb-1.0-dev
      - name: build
        run: cmake -S . -B build && cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure
