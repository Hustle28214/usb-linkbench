name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libusb-1.0-dev
      - name: build
        run: cmake -S . -B build && cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install cmake pkg-config libusb
      - name: build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF && cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: libusb
        run: vcpkg install libusb:x64-windows
      - name: build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake && cmake --build build --config Release
      - name: test
        run: |
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;" + $env:PATH
          ctest --test-dir build -C Release --output-on-failure
      - name: package
        run: |
          cmake --install build --config Release --prefix dist/usb-linkbench-windows-x64
          Copy-Item C:\vcpkg\installed\x64-windows\bin\libusb-1.0.dll dist\usb-linkbench-windows-x64\
          Compress-Archive -Path dist/usb-linkbench-windows-x64 -DestinationPath dist/usb-linkbench-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: usb-linkbench-windows-x64
          path: dist/usb-linkbench-windows-x64.zip
