[package]
name = "usb-linkbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Measure camera USB payload, control round-trip, and negotiated high-speed link rate"
readme = "README.md"
keywords = ["usb", "uvc", "realsense", "orbbec", "benchmark"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4", features = ["derive"] }
nusb = "=0.2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "=0.14.0", default-features = true }

[lib]
name = "usb_linkbench"
path = "src/lib.rs"

[[bin]]
name = "usb-linkbench"
path = "src/main.rs"
